name: Ilk Kurulum

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  Kurulum:
    runs-on: ubuntu-latest
    steps:
      - name: Depo Kontrolü
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Arşivi Aç
        run: |
          if [ ! -f neo_sync.tgz ]; then echo "Arşiv yok, atlanıyor."; exit 0; fi
          tar xzf neo_sync.tgz --exclude=./.github/workflows
          git rm -q --cached neo_sync.tgz
          rm -f neo_sync.tgz
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "NeO | Türkçe eklenti kaynakları"
          git push origin HEAD:main

      - name: builds Dalını Oluştur
        run: |
          if git ls-remote --exit-code --heads origin builds > /dev/null; then echo "builds dalı zaten var."; exit 0; fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q --orphan builds
          git rm -rfq .
          echo "# Derlemeler" > README.md
          git add README.md
          git commit -q -m "builds dalı"
          git push origin builds
