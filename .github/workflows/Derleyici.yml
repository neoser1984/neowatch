name: CloudStream Derleyici

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
      - "**/*.yml"
      - "**/*.jpg"
      - "**/*.png"
      - "**/*.py"

jobs:
  CloudStreamDerleyici:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: "'src' Depo Kontrolü"
        uses: actions/checkout@v4.2.2
        with:
          path: "src"

      - name: "'build' Depo Kontrolü"
        uses: actions/checkout@v4.2.2
        with:
          ref: "builds"
          path: "builds"

      - name: Eski Derlemeleri Temizle
        run: rm $GITHUB_WORKSPACE/builds/*.cs3 || true

      - name: JDK 17 Ayarla
        uses: actions/setup-java@v4.6.0
        with:
          distribution: adopt
          java-version: 17

      # ubuntu-latest imajında Android SDK zaten kurulu (ANDROID_HOME); ayrıca kurulum gerekmiyor
      - name: Eklentileri Derle
        run: |
          cd $GITHUB_WORKSPACE/src
          chmod +x gradlew
          set -o pipefail
          # JitPack (com.github.recloudstream:gradle) GitHub sunucularına zaman zaman yanıt vermiyor.
          # Yalnızca bağımlılık/bağlantı hatalarında, artan beklemeyle en fazla 5 kez dene; gerçek derleme hatasında hemen dur.
          for deneme in 1 2 3 4 5; do
            ek=""; [ "$deneme" -gt 1 ] && ek="--refresh-dependencies"
            if ./gradlew make makePluginsJson $ek 2>&1 | tee /tmp/derleme.log; then break; fi
            if ! grep -qE "Could not (find|resolve|GET|HEAD|download)|jitpack\.io|Read timed out|Connect timed out|Connection reset|Received status code 5" /tmp/derleme.log; then
              echo "::error::Derleme hatası (bağımlılık sorunu değil), yeniden denenmiyor."
              exit 1
            fi
            if [ "$deneme" -eq 5 ]; then echo "::error::JitPack 5 denemede de yanıt vermedi."; exit 1; fi
            bekle=$((deneme * 60))
            echo "::warning::Bağımlılık indirilemedi (deneme $deneme/5). $bekle sn sonra yeniden denenecek..."
            sleep "$bekle"
          done
          cp **/build/*.cs3 $GITHUB_WORKSPACE/builds
          cp build/plugins.json $GITHUB_WORKSPACE/builds

      - name: Derlemeleri Yükle
        run: |
          cd $GITHUB_WORKSPACE/builds
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add .
          git commit --amend -m "$GITHUB_SHA 'nın Derlenmesi" || exit 0   # eğer commit edilecek bir şey yoksa hata verme
          git push --force