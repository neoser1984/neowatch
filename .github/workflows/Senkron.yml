name: Senkron

on:
  push:
    branches:
      - main
    paths:
      - "neo_sync.tgz"

permissions:
  contents: write

jobs:
  Senkron:
    runs-on: ubuntu-latest
    steps:
      - name: Depo Kontrolü
        uses: actions/checkout@v4

      - name: Değişiklikleri Uygula
        run: |
          [ -f neo_sync.tgz ] || exit 0
          rm -rf /tmp/yeni && mkdir -p /tmp/yeni
          tar xzf neo_sync.tgz -C /tmp/yeni
          if [ -f /tmp/yeni/.silinecek ]; then
            while IFS= read -r f || [ -n "$f" ]; do
              [ -n "$f" ] && git rm -q --ignore-unmatch -- "$f"
            done < /tmp/yeni/.silinecek
            rm -f /tmp/yeni/.silinecek
          fi
          rm -rf /tmp/yeni/.github/workflows
          cp -a /tmp/yeni/. .
          git rm -q --cached neo_sync.tgz
          rm -f neo_sync.tgz
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "SuperFilmGeldi v6: superfilmizle.org altyapısı (film, dizi, anime, Pilavyer oynatıcı); KONTROL.py park sayfası filtresi"
          git push origin HEAD:main
